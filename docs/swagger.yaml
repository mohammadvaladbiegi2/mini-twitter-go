definitions:
  apperror.AppError:
    properties:
      errors:
        items:
          additionalProperties:
            type: string
          type: object
        type: array
      message:
        type: string
      status_code:
        type: integer
      type:
        type: string
    type: object
  authdtos.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  authdtos.LoginRes:
    properties:
      token:
        type: string
    type: object
  authdtos.SignUpReq:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  authdtos.SignUpRes:
    properties:
      token:
        type: string
    type: object
  tweet.SimpleResMessage:
    properties:
      message:
        type: string
    type: object
  tweetdtos.BookmarkTweet:
    properties:
      author_avatar_url:
        type: string
      author_username:
        type: string
      book_mark_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      dislike_count:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      like_count:
        type: integer
      reply_count:
        type: integer
      tags:
        items:
          type: string
        type: array
    type: object
  tweetdtos.BookmarksListRes:
    properties:
      bookmarks:
        items:
          $ref: '#/definitions/tweetdtos.BookmarkTweet'
        type: array
      count:
        type: integer
      limit:
        type: integer
      next_cursor:
        type: string
    type: object
  tweetdtos.CreateReplyReq:
    properties:
      content:
        type: string
    type: object
  tweetdtos.CreateReplyRes:
    properties:
      reply:
        $ref: '#/definitions/tweetdtos.Reply'
    type: object
  tweetdtos.CreateTweetRes:
    properties:
      content:
        type: string
      id:
        type: integer
      image_url:
        type: string
      tags:
        items:
          type: string
        type: array
      user_id:
        type: integer
    type: object
  tweetdtos.GetRepliesRes:
    properties:
      count:
        type: integer
      next_cursor:
        type: integer
      replies:
        items:
          $ref: '#/definitions/tweetdtos.Reply'
        type: array
    type: object
  tweetdtos.Reply:
    properties:
      avatar_url:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tweet_id:
        type: integer
      user_id:
        type: integer
      username:
        type: string
    type: object
  uploaddto.UploadResponse:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      hash:
        type: string
      id:
        type: integer
      mime_type:
        type: string
      size:
        type: integer
      url:
        type: string
      user_id:
        type: integer
    type: object
  uploaddto.UploadTweetImageRes:
    properties:
      image_url:
        type: string
      upload_id:
        type: integer
    type: object
  user.SimpleResMessage:
    properties:
      message:
        type: string
    type: object
  userdtos.GetUserByUsernameRes:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      follower_count:
        type: integer
      following_count:
        type: integer
      tweets:
        items:
          $ref: '#/definitions/userdtos.Tweets'
        type: array
      username:
        type: string
    type: object
  userdtos.SearchUsersByUsernameRes:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.TweetForProfile:
    properties:
      bookmark_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      dislike_count:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      like_count:
        type: integer
      reply_count:
        type: integer
      tags:
        items:
          type: string
        type: array
    type: object
  userdtos.Tweets:
    properties:
      bookmark_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      dislike_count:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      like_count:
        type: integer
      reply_count:
        type: integer
      tags:
        items:
          type: string
        type: array
    type: object
  userdtos.UpdateProfileReq:
    properties:
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UpdateProfileRes:
    properties:
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UserGetProfileRes:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      follower_count:
        type: integer
      following_count:
        type: integer
      tweets:
        items:
          $ref: '#/definitions/userdtos.TweetForProfile'
        type: array
      username:
        type: string
    type: object
  userdtos.UsersFollower:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UsersFollowersRes:
    properties:
      count:
        type: integer
      followers:
        items:
          $ref: '#/definitions/userdtos.UsersFollower'
        type: array
      has_next:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  userdtos.UsersFollowing:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UsersFollowingsRes:
    properties:
      count:
        type: integer
      followings:
        items:
          $ref: '#/definitions/userdtos.UsersFollowing'
        type: array
      has_next:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return token
      parameters:
      - description: Login credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authdtos.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdtos.LoginRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Login user
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User signup data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authdtos.SignUpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdtos.SignUpRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Sign up a new user
      tags:
      - Auth
  /tweets/{tweet_id}/bookmark:
    delete:
      produces:
      - application/json
      responses: {}
      summary: Unbookmark tweet
      tags:
      - Tweet Action
    post:
      produces:
      - application/json
      responses: {}
      summary: Bookmark tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/dislike:
    post:
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweet.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Dislike a tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/like:
    post:
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweet.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Like a tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/reaction:
    delete:
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweet.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Remove reaction
      tags:
      - Tweet Action
  /tweets/{tweet_id}/replies:
    get:
      description: Returns replies (newest first). Keyset pagination via optional
        cursor_id.
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      - description: Max items (<=100, default 20)
        in: query
        name: limit
        type: integer
      - description: Fetch items with id < cursor_id
        in: query
        name: cursor_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweetdtos.GetRepliesRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: List replies of a tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/reply:
    post:
      consumes:
      - application/json
      description: Creates a reply for the given tweet_id
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      - description: reply payload
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/tweetdtos.CreateReplyReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tweetdtos.CreateReplyRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Reply to a tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/upload-image:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image and associates it with the given tweet
      parameters:
      - description: ID of the tweet
        in: path
        name: tweet_id
        required: true
        type: integer
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/uploaddto.UploadTweetImageRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Upload an image for a tweet
      tags:
      - Upload
  /tweets/bookmarks:
    get:
      parameters:
      - description: max 50 (default 20)
        in: query
        name: limit
        type: integer
      - description: opaque cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweetdtos.BookmarksListRes'
      summary: List my bookmarks (keyset pagination)
      tags:
      - User Infos
  /tweets/create-new-tweet:
    post:
      description: Create new tweet, The `tags` field is optional
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweetdtos.CreateTweetRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: new Tweet
      tags:
      - Tweet
  /users/follow:
    post:
      parameters:
      - description: Target user ID
        in: query
        name: target_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Follow a user
      tags:
      - User Actions
  /users/followers:
    get:
      description: Returns a paginated list of followers for the authenticated user.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Number of items per page (max 50, default 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userdtos.UsersFollowersRes'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Database or server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Get followers of a user
      tags:
      - User Infos
  /users/followings:
    get:
      description: Returns a paginated list of followings for the authenticated user.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Number of items per page (max 50, default 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userdtos.UsersFollowingsRes'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Database or server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Get followings of a user
      tags:
      - User Infos
  /users/get-by-user-name:
    get:
      description: Search users by their `username`
      parameters:
      - description: User name prefix to search for
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/userdtos.GetUserByUsernameRes'
            type: array
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: get user by username
      tags:
      - User Search
  /users/get-profile:
    get:
      description: get  user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userdtos.UserGetProfileRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: user profile
      tags:
      - User Profile
  /users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a image . If the same file (by SHA256 hash) was uploaded before,
        the existing file metadata & URL will be returned (no duplicate storage).
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Upload succeeded or existing file returned
          schema:
            $ref: '#/definitions/uploaddto.UploadResponse'
        "400":
          description: Validation error (missing file or invalid user_id)
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Upload a user avatar
      tags:
      - Upload
  /users/search-by-user-name:
    get:
      description: Search users by their username. The `limit` parameter is optional
        and defaults to 10 if not provided.
      parameters:
      - description: User name prefix to search for
        in: query
        name: username
        required: true
        type: string
      - description: Maximum number of users to return (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/userdtos.SearchUsersByUsernameRes'
            type: array
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Search users by username
      tags:
      - User Search
  /users/unfollow:
    post:
      parameters:
      - description: Target user ID
        in: query
        name: target_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Unfollow a user
      tags:
      - User Actions
  /users/update-profile:
    put:
      consumes:
      - application/json
      description: Update user profile. At least one of `username` or `bio` must be
        provided. Both fields are optional.
      parameters:
      - description: Update profile payload (username and bio are optional, at least
          one required)
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/userdtos.UpdateProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user profile
          schema:
            $ref: '#/definitions/userdtos.UpdateProfileRes'
        "400":
          description: Validation failed, e.g. no fields provided or invalid values
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Update user profile
      tags:
      - User Profile
swagger: "2.0"
