definitions:
  apperror.AppError:
    properties:
      errors:
        items:
          additionalProperties:
            type: string
          type: object
        type: array
      message:
        type: string
      status_code:
        type: integer
      type:
        type: string
    type: object
  authdtos.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  authdtos.LoginRes:
    properties:
      token:
        type: string
    type: object
  authdtos.SignUpReq:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  authdtos.SignUpRes:
    properties:
      token:
        type: string
    type: object
  userdtos.SearchUsersByUsernameRes:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UpdateProfileReq:
    properties:
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UpdateProfileRes:
    properties:
      bio:
        type: string
      username:
        type: string
    type: object
  userdtos.UserGetProfileRes:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      follower_count:
        type: integer
      following_count:
        type: integer
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return token
      parameters:
      - description: Login credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authdtos.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdtos.LoginRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Login user
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User signup data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authdtos.SignUpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdtos.SignUpRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Sign up a new user
      tags:
      - Auth
  /users/get-profile:
    get:
      description: get  user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userdtos.UserGetProfileRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: user profile
      tags:
      - User
  /users/search-by-user-name:
    get:
      description: Search users by their username. The `limit` parameter is optional
        and defaults to 10 if not provided.
      parameters:
      - description: Username prefix to search for
        in: query
        name: username
        required: true
        type: string
      - description: Maximum number of users to return (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/userdtos.SearchUsersByUsernameRes'
            type: array
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Search users by username
      tags:
      - User
  /users/update-profile:
    put:
      consumes:
      - application/json
      description: Update user profile. At least one of `username` or `bio` must be
        provided. Both fields are optional.
      parameters:
      - description: Update profile payload (username and bio are optional, at least
          one required)
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/userdtos.UpdateProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user profile
          schema:
            $ref: '#/definitions/userdtos.UpdateProfileRes'
        "400":
          description: Validation failed, e.g. no fields provided or invalid values
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Update user profile
      tags:
      - User
swagger: "2.0"
