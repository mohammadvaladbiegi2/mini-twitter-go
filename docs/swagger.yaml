info:
  contact: {}
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return token
      parameters:
      - description: Login credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authdtos.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdtos.LoginRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Login user
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User signup data
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/authdtos.SignUpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/authdtos.SignUpRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Sign up a new user
      tags:
      - Auth
  /tweets/{tweet_id}/dislike:
    post:
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweet.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Dislike a tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/like:
    post:
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweet.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Like a tweet
      tags:
      - Tweet Action
  /tweets/{tweet_id}/reaction:
    delete:
      parameters:
      - description: Tweet ID
        in: path
        name: tweet_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweet.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Remove reaction
      tags:
      - Tweet Action
  /tweets/create-new-tweet:
    post:
      description: Create new tweet, The `tags` field is optional
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tweetdtos.CreateTweetRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: new Tweet
      tags:
      - Tweet
  /users/follow/{target_id}:
    post:
      parameters:
      - description: Target user ID
        in: query
        name: target_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Follow a user
      tags:
      - User Actions
  /users/get-by-user-name/{username}:
    get:
      description: Search users by their `username`
      parameters:
      - description: User name prefix to search for
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/userdtos.GetUserByUsernameRes'
            type: array
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: get users by username
      tags:
      - User Search
  /users/get-profile:
    get:
      description: get  user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/userdtos.UserGetProfileRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: user profile
      tags:
      - User Profile
  /users/search-by-user-name/{username}:
    get:
      description: Search users by their username. The `limit` parameter is optional
        and defaults to 10 if not provided.
      parameters:
      - description: User name prefix to search for
        in: query
        name: username
        required: true
        type: string
      - description: Maximum number of users to return (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/userdtos.SearchUsersByUsernameRes'
            type: array
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Search users by username
      tags:
      - User Search
  /users/unfollow/{target_id}:
    post:
      parameters:
      - description: Target user ID
        in: query
        name: target_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.SimpleResMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Unfollow a user
      tags:
      - User Actions
  /users/update-profile:
    put:
      consumes:
      - application/json
      description: Update user profile. At least one of `username` or `bio` must be
        provided. Both fields are optional.
      parameters:
      - description: Update profile payload (username and bio are optional, at least
          one required)
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/userdtos.UpdateProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user profile
          schema:
            $ref: '#/definitions/userdtos.UpdateProfileRes'
        "400":
          description: Validation failed, e.g. no fields provided or invalid values
          schema:
            $ref: '#/definitions/apperror.AppError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/apperror.AppError'
      summary: Update user profile
      tags:
      - User Profile
swagger: "2.0"
